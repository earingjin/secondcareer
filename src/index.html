<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세컨플래닝 | 퇴직준비도 진단</title>
<style>
:root{
  --peach:#D7EBEC; --blush:#AFD6D9; --coral:#2F7C82; --coral-deep:#256A70;
  --mint:#6FB39A; --mint-deep:#3E8A6E; --gold:#E0B04A;
  --bar:#4D9FA5; --avg:#D9D9D9; --pre:#82BDC2; --post:#2F7C82; --slate:#555B69;
  --a1:#E75852; --a2:#F17944; --a3:#2FA5CB; --a4:#3696E0; --a5:#8268CD;
  --cream:#F1F8F5; --card:#FFFFFF; --ink:#2B3A3D; --ink-soft:#5D7074; --line:#D5E5E2;
  --tint-coral:#D7EBEC; --tint-gold:#F6F3DE; --tint-mint:#E2F0D9; --tint-blue:#E3EEF9;
  --hero-a:#D3E8EA; --hero-b:#B9DADD; --hero-c:#92C5C9; --hero-ink:#1F3B40;
  --nav-bg:rgba(241,248,245,.9); --shadow:rgba(47,110,115,.14);
  --sheet-bg:linear-gradient(180deg,#E8F3F0 0,#FFFFFF 260px);
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --cream:#12201F; --card:#1C2E2E; --ink:#E8F2F0; --ink-soft:#A9C2C0; --line:#30494A;
    --tint-coral:#244244; --tint-gold:#3A3822; --tint-mint:#27402F; --tint-blue:#26364F;
    --hero-a:#24474B; --hero-b:#1F5A5F; --hero-c:#1A6B70; --hero-ink:#E4F4F2;
    --nav-bg:rgba(18,32,31,.9); --shadow:rgba(0,0,0,.4); --sheet-bg:#1C2E2E;
    --coral-deep:#8ED2D6; --mint-deep:#8BD0B0; --mint:#6FB39A; --blush:#2F5C60; --peach:#25454A;
    --bar:#5FB8BE; --avg:#4A5D5D; --pre:#5F9FA4; --post:#9AD8DC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --cream:#12201F; --card:#1C2E2E; --ink:#E8F2F0; --ink-soft:#A9C2C0; --line:#30494A;
  --tint-coral:#244244; --tint-gold:#3A3822; --tint-mint:#27402F; --tint-blue:#26364F;
  --hero-a:#24474B; --hero-b:#1F5A5F; --hero-c:#1A6B70; --hero-ink:#E4F4F2;
  --nav-bg:rgba(18,32,31,.9); --shadow:rgba(0,0,0,.4); --sheet-bg:#1C2E2E;
  --coral-deep:#8ED2D6; --mint-deep:#8BD0B0; --mint:#6FB39A; --blush:#2F5C60; --peach:#25454A;
  --bar:#5FB8BE; --avg:#4A5D5D; --pre:#5F9FA4; --post:#9AD8DC;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{font-family:var(--font);color:var(--ink);background:var(--cream);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--nav-bg);backdrop-filter:blur(8px)}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}
.narrow{max-width:820px;margin:0 auto;padding:0 20px}

/* NAV */
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--nav-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1160px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:var(--coral-deep);cursor:pointer}
.brand .mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--blush),var(--peach));display:flex;align-items:center;justify-content:center;font-size:17px}
.seg{display:inline-flex;background:var(--tint-coral);border-radius:999px;padding:4px}
.seg button{padding:9px 18px;min-height:40px;border-radius:999px;font-size:14px;font-weight:800;color:var(--ink-soft)}
.seg button.on{background:var(--coral);color:#fff;box-shadow:0 6px 14px rgba(47,124,130,.3)}
.proto-note{background:var(--tint-gold);color:var(--ink);font-size:13px;font-weight:700;text-align:center;padding:8px 16px}

/* HERO */
.hero{background:linear-gradient(160deg,var(--hero-a) 0%,var(--hero-b) 62%,var(--hero-c) 100%);padding:56px 0 130px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.blob.b1{width:260px;height:260px;background:#fff;opacity:.16;top:-80px;left:-90px}
.blob.b2{width:170px;height:170px;background:#fff;opacity:.22;bottom:30px;left:5%}
.blob.b3{width:120px;height:120px;background:#fff;opacity:.2;top:18%;right:6%}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;position:relative;z-index:2}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);padding:8px 18px;border-radius:999px;font-size:13px;font-weight:800;color:var(--coral-deep);margin-bottom:20px}
.hero h1{font-size:44px;line-height:1.25;color:var(--hero-ink);margin-bottom:14px}
.hero h1 .hl{color:var(--coral-deep)}
.hero .lead{font-size:16px;color:var(--hero-ink);opacity:.85;max-width:470px;margin-bottom:22px}
.hero .hint{font-size:14px;font-weight:700;color:var(--hero-ink);opacity:.8}
.flow-mini{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;font-size:14px;font-weight:700;color:var(--hero-ink)}

/* CARDS / FORMS */
.card{background:var(--card);border-radius:26px;padding:28px;box-shadow:0 16px 34px var(--shadow)}
.card h2{font-size:21px;margin-bottom:6px}
.card .sub{font-size:14px;color:var(--ink-soft);margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-size:13px;font-weight:800;color:var(--ink-soft)}
.field .req{color:var(--coral)}
.in{width:100%;min-height:48px;padding:11px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);transition:border-color .15s}
.in:focus{border-color:var(--coral);outline:none}
textarea.in{min-height:120px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hintline{font-size:12.5px;color:var(--ink-soft)}
.err{color:var(--coral-deep);font-size:13px;font-weight:700;min-height:20px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:12px 26px;border-radius:999px;font-size:15px;font-weight:800;background:var(--coral);color:#fff;box-shadow:0 10px 20px rgba(47,124,130,.25);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.block{width:100%}
.btn.mint{background:var(--mint-deep);box-shadow:0 10px 20px rgba(62,138,110,.25)}
.btn.ghost{background:var(--card);color:var(--coral-deep);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{min-height:38px;padding:7px 14px;font-size:13px;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* STEPPER */
.stepper{display:flex;gap:8px;margin:26px 0 18px;flex-wrap:wrap}
.stepper .st{flex:1;min-width:120px;padding:10px 14px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:800;color:var(--ink-soft);display:flex;gap:8px;align-items:center}
.stepper .st i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.stepper .st.on{border-color:var(--coral);color:var(--ink)}
.stepper .st.on i{background:var(--coral);color:#fff}
.stepper .st.done i{background:var(--mint-deep);color:#fff}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;padding:10px 16px;min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-align:left}
.chip.on{background:var(--tint-coral);border-color:var(--coral);color:var(--coral-deep)}
.chip b{width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.q{padding:18px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border:0}
.q .qt{font-size:15px;font-weight:700;margin-bottom:12px}
.q .qt small{display:block;font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:16px}
.scale button.on{background:var(--coral);border-color:var(--coral);color:#fff}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:6px;font-weight:700}
.area-head{display:flex;align-items:center;gap:10px;margin:24px 0 4px}
.area-head .badge{font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--tint-mint);color:var(--mint-deep)}
.progressbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.progressbar span{display:block;height:100%;background:linear-gradient(90deg,var(--blush),var(--coral));border-radius:999px;transition:width .25s}
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--card);z-index:20;padding:10px 0 4px}

/* REPORT SHEETS */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:22px 0}
.sheet{background:var(--sheet-bg);border:1px solid var(--line);border-radius:22px;padding:28px 30px;margin-bottom:22px;box-shadow:0 10px 26px var(--shadow);position:relative}
.sh-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);font-weight:700;border-bottom:1.5px solid #B8C6C4;padding-bottom:8px;margin-bottom:18px}
.sh-head span:first-child{color:var(--coral-deep)}
.sh-foot{margin-top:22px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sheet h3.st{font-size:17px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sheet h3.st::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mint)}
.cover{text-align:center;padding:60px 10px 50px;background:linear-gradient(160deg,var(--tint-gold),var(--tint-coral));border-radius:18px}
.cover .tag{font-size:13px;color:var(--ink-soft);font-weight:700}
.cover h2{font-size:44px;color:var(--coral-deep);margin:14px 0 6px}
.cover .meta{margin-top:28px;font-size:16px;font-weight:700}
.ribbon{background:var(--tint-coral);color:var(--coral-deep);text-align:center;font-weight:800;font-size:13px;padding:8px;border-radius:12px;margin-bottom:14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
table.t th{background:var(--tint-coral);font-weight:800;white-space:nowrap;width:1%}
table.t.c th,table.t.c td{text-align:center}
table.t.zebra tr:nth-child(even) td{background:rgba(77,159,165,.07)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700;margin:6px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
svg{display:block;width:100%;height:auto}
svg .grid{stroke:var(--line);stroke-width:1}
svg .grid.dash{stroke-dasharray:4 4}
svg .axis,svg .lab,svg .val{fill:var(--ink-soft);font-size:11px;font-family:var(--font);font-weight:700}
svg .lab{font-size:12.5px;fill:var(--ink)}
svg .val{fill:var(--ink);font-size:12px}
svg .me{fill:var(--bar)} svg .avg{fill:var(--avg)} svg .pre{fill:var(--pre)} svg .post{fill:var(--post)}
svg .ra1{fill:var(--a1)} svg .ra2{fill:var(--a2)} svg .ra3{fill:var(--a3)} svg .ra4{fill:var(--a4)} svg .ra5{fill:var(--a5)}
.area-desc{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;margin-top:14px}
.area-desc .nm{font-weight:800;font-size:14px}
.area-desc .nm small{display:block;color:var(--ink-soft);font-weight:600;font-size:12px}
.area-desc p{font-size:13.5px;color:var(--ink-soft);padding-bottom:10px;border-bottom:1px dashed var(--line)}
.score-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;margin:10px 0}
.score-row div{background:var(--tint-mint);border-radius:14px;padding:10px 4px}
.score-row b{display:block;font-size:22px;color:var(--mint-deep)}
.score-row span{font-size:12px;font-weight:800;color:var(--ink-soft)}
.fbars{display:grid;grid-template-columns:110px 1fr 26px;gap:6px 10px;align-items:center;font-size:13px}
.fbars .bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.fbars .bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blush),var(--coral))}
.fbars .grp{grid-column:1/-1;font-weight:800;margin-top:10px;color:var(--coral-deep)}
.quote{background:var(--tint-gold);border-radius:16px;padding:16px 18px;font-size:14px;margin-top:14px}
.quote strong{display:block;margin-bottom:6px}
.counselor-card{margin-top:16px;border:1.5px dashed var(--line);border-radius:16px;padding:12px 16px;font-size:13.5px}

/* form sheet */
.formbar{background:#173A87;color:#fff;padding:14px 20px;border-radius:12px;font-size:22px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.formbar small{font-size:13px;font-weight:700}
.cons{background:var(--tint-gold);border-radius:14px;padding:14px 18px;font-size:13px;margin-top:12px}

/* ADMIN */
.tabs{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}
.tabs button{padding:11px 20px;min-height:44px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:14px;color:var(--ink-soft)}
.tabs button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.tile{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:0 10px 24px var(--shadow)}
.tile span{font-size:13px;font-weight:800;color:var(--ink-soft)}
.tile b{display:block;font-size:30px;margin-top:2px}
.tile.c1 b{color:var(--coral-deep)} .tile.c2 b{color:var(--mint-deep)} .tile.c3 b{color:#B07A12}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .in{width:auto;min-width:150px;min-height:44px;padding:8px 14px}
.badge-s{display:inline-block;font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap}
.s-post{background:#DCF0E9;color:#2F7766} .s-pre{background:var(--tint-blue);color:#3F55B4}
.s-prog{background:var(--tint-gold);color:#95610F} .s-new{background:var(--line);color:var(--ink-soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s-post{background:#244A41;color:#9FE0CE}:root:not([data-theme="light"]) .s-pre{background:#2F3A66;color:#AFC0FF}:root:not([data-theme="light"]) .s-prog{background:#54421F;color:#FFD488}}
.dots{display:inline-flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--mint-deep)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acct{margin-top:14px}
.empty{text-align:center;color:var(--ink-soft);padding:36px 10px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--cream);padding:12px 22px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;transition:.25s;z-index:100;max-width:90vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer.ft{margin-top:50px;background:linear-gradient(160deg,var(--hero-a),var(--hero-c));padding:32px 0;color:var(--hero-ink);font-size:13.5px}
footer.ft .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer.ft b{font-size:16px}

@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr}.hero h1{font-size:32px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .area-desc{grid-template-columns:1fr}
  .row3{grid-template-columns:1fr}
}
.donut{max-width:230px;margin:0 auto;text-align:center}
.dn-bg{fill:none;stroke:var(--line);stroke-width:16}
.dn-fg{fill:none;stroke-width:16;stroke-linecap:butt}
.dn-fg.dpre{stroke:var(--pre)} .dn-fg.dpost{stroke:var(--post)}
.dn-pct{font-size:28px;font-weight:800;fill:var(--ink);font-family:var(--font)}
.dn-sub{font-size:12px;font-weight:700;fill:var(--ink-soft);font-family:var(--font)}
.dn-lab{font-weight:800;font-size:15px;margin-top:4px}
.stk{display:flex;height:24px;border-radius:999px;overflow:hidden;background:var(--line);margin:10px 0}
.stk span{display:block;height:100%}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
svg .rpre{fill:var(--pre)} svg .rpost{fill:var(--post)}
.cl-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;margin:26px 0 18px}
.cl-head .who{display:flex;align-items:center;gap:14px}
.cl-head img.logo{margin:0;max-height:48px}
@media (max-width:560px){.seg button{padding:8px 11px;font-size:13px}}
.perm{background:var(--tint-mint);border-radius:16px;padding:12px 16px;font-size:13px;margin:14px 0 0;line-height:1.6}
.perm b{color:var(--mint-deep);margin-right:8px}
.perm .no{display:block;color:var(--ink-soft);margin-top:2px}
.qbar{background:#555B69;color:#fff;padding:10px 16px;font-weight:800;border-radius:6px;font-size:15px}
.rbase{text-align:right;font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:10px}
.sat2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.hbrow{display:grid;grid-template-columns:minmax(110px,1.4fr) 2fr minmax(84px,.9fr);gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
.hbrow .hl{font-weight:700}
.hb{height:26px;border-radius:6px;background:var(--line);overflow:hidden}
.hb span{display:block;height:100%;background:var(--bar);border-radius:6px}
.hbrow.tot .hb span{background:var(--coral)}
.hv b{font-size:15px;margin-right:4px}
.pie{width:170px;margin:14px auto 4px}
.pie-lab{text-align:center;font-weight:800;margin-bottom:14px}
.sidechart{display:grid;grid-template-columns:minmax(220px,1fr) 2.4fr;gap:20px;align-items:start;margin-top:14px}
.topitem{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;margin-bottom:12px;font-weight:700;font-size:14px;color:#fff;line-height:1.35}
.topitem b{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;color:#222;display:flex;align-items:center;justify-content:center}
.topitem.t1{background:#2F7C82}.topitem.t2{background:#3E7F5C}.topitem.t3{background:#3F6FB5}
.opinion{background:var(--tint-gold);border-radius:14px;padding:12px 16px;margin-bottom:8px;font-size:14px}
table.t td.hl1{background:#FFC000;color:#3A2C2F;font-weight:800}
table.t td.hl2{background:#F4A261;color:#3A2C2F;font-weight:800}
.fnote{font-size:12px;color:var(--ink-soft);text-align:right;margin-top:6px}
.axisnote{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);font-weight:700;margin:6px 0}
.axisnote i{flex:1;height:1px;background:var(--ink-soft);opacity:.5}
svg .top{font-size:13px;font-weight:800;fill:var(--coral-deep);font-family:var(--font)}
svg .top.dn{fill:#4B5FB5}
svg .rank{font-size:12px;font-weight:800;fill:var(--coral-deep);font-family:var(--font)}
svg .dbox{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:6 4}
svg .rgray{fill:var(--ink-soft);opacity:.4}
@media (max-width:900px){.sat2,.sidechart{grid-template-columns:1fr}}
.rnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 8px}
.rtitle{flex:1;text-align:center;font-weight:800;font-size:16px;line-height:1.35}
.rtitle b{display:block;font-size:12px;color:var(--coral-deep);margin-bottom:2px}
.rarrow{width:48px;height:48px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);font-size:26px;font-weight:800;color:var(--coral-deep);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 14px var(--shadow)}
.rarrow[disabled]{opacity:.35;cursor:not-allowed}
.rdots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.rdots button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:13px;color:var(--ink-soft)}
.rdots button.on{background:var(--coral);border-color:var(--coral);color:#fff}
@keyframes inr{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
#rslide.slide-r{animation:inr .28s ease-out}
#rslide.slide-l{animation:inl .28s ease-out}
@media (prefers-reduced-motion:reduce){#rslide{animation:none!important}}
table.t.ops{table-layout:fixed}
table.t.ops th:first-child,table.t.ops td:first-child{width:56px;background:var(--tint-coral);text-align:center;font-weight:800}
table.t.ops th:nth-child(2),table.t.ops td:nth-child(2){width:120px}
table.t.ops th:nth-child(3){width:auto}
.t.ops td:nth-child(2){text-align:center;color:var(--ink-soft);white-space:nowrap}
.forest{position:absolute;left:0;right:0;bottom:0;width:100%;pointer-events:none}
.forest.hf{height:30%;z-index:1;opacity:.95}
.hero-grid{z-index:2}
.sheet.cvs{padding:0;overflow:hidden;background:#BFDDE1}

.cv .forest{height:58%}
.cv-top{position:absolute;left:5%;right:5%;top:3%;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cv-logos{display:flex;align-items:center;gap:12px}
.cv-client{background:rgba(255,255,255,.88);border-radius:8px;padding:4px 8px}.cv-client img{max-height:30px;max-width:120px;display:block}
.cv-guide{font-size:12px;color:#5D7074}
.cv-diamond{position:absolute;left:50%;top:16%;width:min(40%,270px);aspect-ratio:1;border:6px solid #A5CBC4;transform:translateX(-50%) rotate(45deg)}
.cv-paper{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(72%,440px);background:#FBF8EE;text-align:center;padding:30px 18px 26px;clip-path:polygon(2% 6%,30% 0,62% 3%,98% 0,100% 40%,97% 95%,60% 100%,25% 97%,0 100%,1% 50%)}
.cv-sub{color:#4D9FA5;font-size:clamp(11px,2.2vw,15px)}
.cv-paper h2{font-size:clamp(18px,5vw,36px);word-break:keep-all;color:#3F3F3F;margin:6px 0}
.cv-en{color:#777;font-size:clamp(10px,2vw,13px)}
.cv-date{position:absolute;left:50%;transform:translateX(-50%);top:50%;color:#3F8489;display:flex;gap:10px;align-items:center;font-size:15px;white-space:nowrap}
.cv-name{position:absolute;left:50%;transform:translateX(-50%);bottom:12%;color:#fff;font-size:17px;white-space:nowrap}
.cv-foot{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 5%;font-size:11px;color:#555;line-height:1.4}
.logo-jm{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:#17488F;font-size:16px}
.logo-hdc{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#2F7C82;font-size:12px}
.sh-foot .ft-l{display:inline-flex}
.logo-jm svg{width:22px;height:26px;flex:none}
.logo-hdc{white-space:nowrap;line-height:1.15}
.logo-hdc svg{width:26px;height:20px;flex:none}
.need .ttl svg,.band svg,.cv-date svg{width:22px;height:22px;flex:none}
.ci svg{width:16px;height:16px}
.p2top{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;margin-bottom:10px}
.need .ttl{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--coral-deep);margin-bottom:8px}
